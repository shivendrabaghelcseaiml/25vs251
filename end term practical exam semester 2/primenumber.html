<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="number"]:focus {
            border-color: #764ba2;
        }

        button {
            width: 100%;
            background-color: #764ba2;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #5a3782;
        }

        button:active {
            transform: scale(0.98);
        }

        #result-display {
            margin-top: 24px;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .prime-success {
            background-color: #edf7ed;
            color: #1e4620;
            border: 1px solid #c3e6cb;
        }

        .prime-fail {
            background-color: #fdeded;
            color: #5f2120; 
            border: 1px solid #f5c6cb;
        }

        .prime-error {
            background-color: #fff3cd;
            color: #664d03;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Prime Number Checker</h1>
        
        <div class="input-group">
            <input type="number" id="userInput" placeholder="Enter a whole number..." min="1">
        </div>
        
        <button id="checkBtn">Verify Number</button>
        
        <div id="result-display"></div>
    </div>

    <script>
        const userInput = document.getElementById('userInput');
        const checkBtn = document.getElementById('checkBtn');
        const resultDisplay = document.getElementById('result-display');

        checkBtn.addEventListener('click', () => {
            const rawValue = userInput.value;
            
            resultDisplay.textContent = "";
            resultDisplay.className = ""; 

            if (rawValue === "") {
                resultDisplay.textContent = "⚠️ Please input a number first.";
                resultDisplay.classList.add('prime-error');
                return;
            }

            const num = parseInt(rawValue);

            if (num <= 1) {
                resultDisplay.textContent = `❌ ${num} is not a prime number.`;
                resultDisplay.classList.add('prime-fail');
                return;
            }

            let isPrime = true;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
            if (isPrime) {
                resultDisplay.textContent = `🎉 ${num} is a prime number!`;
                resultDisplay.classList.add('prime-success');
            } else {
                resultDisplay.textContent = `❌ ${num} is not a prime number.`;
                resultDisplay.classList.add('prime-fail');
            }
        });
    </script>

</body>
</html>
